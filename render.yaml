services:
  - type: web
    name: procurement-test-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/lab/health
    envVars:
      - key: TESTLAB_KEY
        generateValue: true
      - key: TESTLAB_MAX_PARALLELISM
        value: "1"
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCConserveMemory
        value: "7"
